name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Throwaway database for the integration tests only. The credentials
    # exist only inside this CI job and protect nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lpg
          POSTGRES_PASSWORD: lpg_ci_only
          POSTGRES_DB: lpg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lpg -d lpg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # The export tests rasterize and encode JPGs with python3 and Pillow.
      # tests/merge.test.ts (run by npm test) needs it too: without Pillow
      # its export comes back failed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for the export tests
        run: python3 -m pip install --quiet pillow
      - name: Tests
        run: npm test
      - name: Engine tests (templates, mockups, export, storage, 3D studio)
        run: ./tests/run-tests.sh
      - name: Database integration tests (real PostgreSQL)
        env:
          DATABASE_URL: postgresql://lpg:lpg_ci_only@localhost:5432/lpg_ci?schema=public
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma migrate deploy --schema prisma/schema.prisma
          node --test tests/db-integration.test.mjs
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/listing_photos_generator?schema=public
        run: npm run prisma:validate
      - name: Check for em dashes and en dashes
        run: |
          if LC_ALL=C.UTF-8 grep -rIP '\x{2014}|\x{2013}' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude=package-lock.json .; then
            echo "Em dash or en dash found in the repository. Use a hyphen or comma instead."
            exit 1
          fi
