name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/listing_photos_generator?schema=public
        run: npm run prisma:validate
      - name: Check for em dashes and en dashes
        run: |
          if grep -rP '\x{2014}|\x{2013}' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude=package-lock.json .; then
            echo "Em dash or en dash found in the repository. Use a hyphen or comma instead."
            exit 1
          fi
