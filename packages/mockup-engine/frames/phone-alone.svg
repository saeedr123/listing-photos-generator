<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 1000" width="2000" height="3000" role="img" aria-label="Phone mockup frame, built in house">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6DC"/><stop offset="1" stop-color="#E3CDBD"/>
    </linearGradient>
    <linearGradient id="phone-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="667" height="1000" fill="#F7E8E6"/>
  <rect y="640" width="667" height="360" fill="url(#desk)"/>
  <ellipse cx="333" cy="900" rx="220" ry="24" fill="#000000" opacity="0.18" filter="url(#soft-shadow)"/>
  <g>
    <rect x="133" y="80" width="400" height="780" rx="48" fill="url(#phone-body)"/>
    <rect x="152" y="100" width="362" height="740" rx="34" fill="#FFFFFF"/>
    <rect x="152" y="100" width="362" height="740" rx="34" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="283" y="112" width="100" height="14" rx="7" fill="#222222"/>
    <circle cx="120" cy="920" r="34" fill="#FFFFFF" opacity="0.9"/>
    <rect x="96" y="880" width="48" height="10" rx="5" fill="#7A4A3A"/>
    <rect x="112" y="858" width="16" height="26" rx="8" fill="#7A4A3A"/>
  </g>
  <rect x="152" y="100" width="362" height="740" fill="none" stroke="#C9A227" stroke-width="1" stroke-dasharray="6 6" opacity="0.35"/>
</svg>
