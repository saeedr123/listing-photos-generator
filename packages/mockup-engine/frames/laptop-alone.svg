<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" width="3000" height="2000" role="img" aria-label="Laptop mockup frame, built in house">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6DC"/><stop offset="1" stop-color="#E3CDBD"/>
    </linearGradient>
    <linearGradient id="screen-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/><stop offset="1" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="laptop-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C9C9"/><stop offset="1" stop-color="#8F8F8F"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft-shadow-small" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1000" height="667" fill="#F7E8E6"/>
  <rect y="430" width="1000" height="237" fill="url(#desk)"/>
  <circle cx="880" cy="420" r="10" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="905" cy="380" r="7" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="500" cy="560" rx="360" ry="26" fill="#000000" opacity="0.18" filter="url(#soft-shadow)"/>
  <g>
    <rect x="180" y="60" width="640" height="400" rx="14" fill="url(#screen-bezel)"/>
    <rect x="196" y="76" width="608" height="368" rx="6" fill="#FFFFFF"/>
    <rect x="196" y="76" width="608" height="368" rx="6" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 140 470 L 860 470 L 890 545 L 110 545 Z" fill="url(#laptop-base)"/>
    <rect x="430" y="470" width="140" height="14" rx="7" fill="#6E6E6E"/>
    <ellipse cx="880" cy="500" rx="46" ry="10" fill="#B76E79" opacity="0.85"/>
    <rect x="872" y="440" width="16" height="52" rx="8" fill="#7A4A3A"/>
    <circle cx="880" cy="428" r="26" fill="#7FA36B"/>
    <circle cx="862" cy="414" r="18" fill="#93B57E"/>
    <circle cx="898" cy="412" r="16" fill="#86AC72"/>
  </g>
  <rect x="196" y="76" width="608" height="368" fill="none" stroke="#C9A227" stroke-width="1" stroke-dasharray="6 6" opacity="0.35"/>
</svg>
