# Production stack for one server: the web app, PostgreSQL, and Caddy for
# HTTPS. Run from the repository root:
#
#   cp deploy/env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# See docs/deployment-nvconsult.md before the first start.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-lpg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lpg} -d ${POSTGRES_DB:-lpg}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lpg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lpg}?schema=public
      LPG_SEED_ADMIN_EMAIL: ${LPG_SEED_ADMIN_EMAIL:-}
      LPG_SEED_ADMIN_PASSWORD: ${LPG_SEED_ADMIN_PASSWORD:-}
      OBJECT_STORAGE_PROVIDER: local_file
      OBJECT_STORAGE_LOCAL_DIR: /data/storage
      # One proxy (Caddy) sits in front of the app.
      LPG_TRUSTED_PROXY_HOPS: "1"
      APP_URL: https://${LPG_DOMAIN:?Set LPG_DOMAIN in deploy/.env}
      NEXT_PUBLIC_APP_URL: https://${LPG_DOMAIN}
    volumes:
      - storage:/data/storage
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      LPG_DOMAIN: ${LPG_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
